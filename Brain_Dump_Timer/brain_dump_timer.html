<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brain Dump Timer</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f1eb;
      --panel: #fffdf9;
      --text: #302d2a;
      --muted: #756e67;
      --accent: #bd7059;
      --accent-dark: #995542;
      --border: #dfd6cc;
      --focus: #365f8d;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #fffaf3 0, var(--bg) 58%);
      color: var(--text);
      font: 16px/1.5 Georgia, "Times New Roman", serif;
    }

    main { width: min(760px, calc(100% - 32px)); margin: 0 auto; padding: 48px 0; }
    header { text-align: center; margin-bottom: 28px; }
    h1 { margin: 0; font-size: clamp(2rem, 7vw, 3.5rem); font-weight: 400; letter-spacing: -.03em; }
    header p { margin: 8px 0 0; color: var(--muted); }

    .card {
      padding: clamp(20px, 5vw, 40px);
      background: color-mix(in srgb, var(--panel) 94%, transparent);
      border: 1px solid var(--border);
      border-radius: 22px;
      box-shadow: 0 18px 50px #7f62401c;
    }

    .timer {
      margin: 0 0 22px;
      color: var(--accent-dark);
      font: 500 clamp(3rem, 12vw, 6rem)/1 ui-monospace, SFMono-Regular, Consolas, monospace;
      letter-spacing: .04em;
      text-align: center;
    }

    .timer[aria-live] { outline: none; }
    textarea {
      display: block;
      width: 100%;
      min-height: 360px;
      resize: vertical;
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: #fffefa;
      color: var(--text);
      font: 1.15rem/1.7 Georgia, "Times New Roman", serif;
    }

    textarea:focus, button:focus-visible, input:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
    textarea.fade-out { animation: fade-text 8s ease-in forwards; }
    @keyframes fade-text { from { opacity: 1; } to { opacity: 0; } }

    .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 18px; }
    button {
      border: 1px solid var(--accent);
      border-radius: 999px;
      padding: 10px 18px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      font: 600 .95rem/1.2 system-ui, sans-serif;
    }
    button:hover { background: var(--accent-dark); border-color: var(--accent-dark); }
    button.secondary { background: transparent; color: var(--accent-dark); }
    button:disabled { cursor: not-allowed; opacity: .5; }
    label { display: flex; gap: 8px; align-items: center; margin-left: auto; color: var(--muted); font: .9rem system-ui, sans-serif; }
    input[type="checkbox"] { accent-color: var(--accent); }
    .status { min-height: 1.5em; margin: 18px 0 0; color: var(--muted); text-align: center; font: .9rem system-ui, sans-serif; }
    .hint { margin: 22px 0 0; color: var(--muted); font: .85rem/1.5 system-ui, sans-serif; text-align: center; }

    @media (max-width: 560px) {
      main { padding: 28px 0; }
      label { width: 100%; margin-left: 0; }
      textarea { min-height: 300px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; }
      textarea.fade-out { animation-duration: 1s; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Brain dump</h1>
      <p>Five quiet minutes. No editing, no judging.</p>
    </header>

    <section class="card" aria-label="Five-minute free-write">
      <div id="timer" class="timer" role="timer" aria-live="polite">05:00</div>
      <textarea id="writing" aria-label="Free-write area" placeholder="Begin anywhere..."></textarea>
      <div class="controls">
        <button id="start" type="button">Start writing</button>
        <button id="reset" class="secondary" type="button">Start fresh</button>
        <button id="save" class="secondary" type="button">Save now</button>
        <label><input id="autoSave" type="checkbox"> Save automatically at the end</label>
      </div>
      <p id="status" class="status" role="status">Your writing stays in this browser.</p>
      <p class="hint">When time is up, your words will gently fade away. Save first if you want to keep them.</p>
    </section>
  </main>

  <script>
    const DURATION = 5 * 60;
    const FADE_DURATION = 8000;
    const timer = document.getElementById("timer");
    const writing = document.getElementById("writing");
    const startButton = document.getElementById("start");
    const resetButton = document.getElementById("reset");
    const saveButton = document.getElementById("save");
    const autoSave = document.getElementById("autoSave");
    const status = document.getElementById("status");

    let remaining = DURATION;
    let intervalId = null;
    let ending = false;

    function renderTime() {
      const minutes = Math.floor(remaining / 60).toString().padStart(2, "0");
      const seconds = (remaining % 60).toString().padStart(2, "0");
      timer.textContent = `${minutes}:${seconds}`;
    }

    function setStatus(message) {
      status.textContent = message;
    }

    function saveWriting() {
      const text = writing.value;
      if (!text.trim()) {
        setStatus("There is nothing to save yet.");
        writing.focus();
        return;
      }

      const stamp = new Date().toISOString().slice(0, 10);
      const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = `brain-dump-${stamp}.txt`;
      link.click();
      URL.revokeObjectURL(link.href);
      setStatus("Saved a copy to your downloads.");
    }

    function finish() {
      ending = true;
      clearInterval(intervalId);
      intervalId = null;
      startButton.disabled = true;
      startButton.textContent = "Time is up";
      if (autoSave.checked) saveWriting();
      setStatus(autoSave.checked ? "Saved. Your words are fading gently..." : "Time is up. Save now if you want to keep your words.");
      writing.classList.add("fade-out");
      window.setTimeout(() => {
        writing.value = "";
        writing.classList.remove("fade-out");
        remaining = DURATION;
        renderTime();
        startButton.disabled = false;
        startButton.textContent = "Start writing";
        ending = false;
        setStatus("Fresh page ready.");
        writing.focus();
      }, FADE_DURATION);
    }

    function toggleTimer() {
      if (ending) return;
      if (intervalId) {
        clearInterval(intervalId);
        intervalId = null;
        startButton.textContent = "Resume";
        setStatus("Paused. Your writing is safe for now.");
        return;
      }

      startButton.textContent = "Pause";
      setStatus("Writing time is underway.");
      intervalId = window.setInterval(() => {
        remaining -= 1;
        renderTime();
        if (remaining <= 0) finish();
      }, 1000);
    }

    function reset() {
      clearInterval(intervalId);
      intervalId = null;
      ending = false;
      remaining = DURATION;
      writing.value = "";
      writing.classList.remove("fade-out");
      startButton.disabled = false;
      startButton.textContent = "Start writing";
      renderTime();
      setStatus("Fresh page ready.");
      writing.focus();
    }

    startButton.addEventListener("click", toggleTimer);
    resetButton.addEventListener("click", reset);
    saveButton.addEventListener("click", saveWriting);
    renderTime();
  </script>
</body>
</html>
