<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pixel Pet Planner</title>
  <style>
    :root {
      --bg: #f3efe3; --panel: #fffaf0; --text: #302d28; --muted: #777064;
      --border: #ded4c0; --accent: #d67655; --accent-dark: #a9523a;
      --green: #668f65; --shadow: 0 16px 40px #6d593522;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; color: var(--text);
      background: radial-gradient(circle at 50% -10%, #fffdf6, var(--bg) 62%);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main { width: min(1060px, calc(100% - 32px)); margin: auto; padding: 34px 0 56px; }
    header { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; margin-bottom: 24px; }
    h1 { margin: 0; font: 700 clamp(1.8rem, 5vw, 2.8rem)/1.1 Georgia, serif; letter-spacing: -.03em; }
    header p { margin: 8px 0 0; color: var(--muted); }
    .week-label { color: var(--muted); font-size: .85rem; text-align: right; }
    .layout { display: grid; grid-template-columns: minmax(250px, .85fr) minmax(0, 1.4fr); gap: 20px; }
    .card { padding: 22px; background: var(--panel); border: 1px solid var(--border); border-radius: 20px; box-shadow: var(--shadow); }
    .pet-card { text-align: center; }
    .pet-stage { min-height: 220px; display: grid; place-items: center; margin: -4px 0 8px; border-radius: 16px; background: #e7edcc; overflow: hidden; }
    .pet { position: relative; width: 150px; height: 150px; filter: drop-shadow(8px 10px 0 #4b493c33); transform-origin: bottom; animation: bob 3s ease-in-out infinite; }
    .pet .pixel { position: absolute; background: var(--pet); box-shadow: 0 0 0 2px var(--pet); }
    .pet .body { width: 86px; height: 72px; left: 32px; top: 52px; border-radius: 35% 35% 45% 45%; }
    .pet .ear { width: 30px; height: 38px; top: 30px; background: var(--pet-dark); }
    .pet .ear.left { left: 30px; transform: rotate(-25deg); }
    .pet .ear.right { right: 30px; transform: rotate(25deg); }
    .pet .eye { width: 10px; height: 14px; top: 75px; background: #302c35; box-shadow: none; }
    .pet .eye.left { left: 55px; } .pet .eye.right { right: 55px; }
    .pet .nose { width: 10px; height: 7px; left: 70px; top: 94px; background: #8c4c54; box-shadow: none; }
    .pet .foot { width: 26px; height: 18px; top: 116px; background: var(--pet-dark); box-shadow: none; }
    .pet .foot.left { left: 42px; } .pet .foot.right { right: 42px; }
    .stage-1 { --pet: #e5a667; --pet-dark: #bd744b; }
    .stage-2 { --pet: #79b4a1; --pet-dark: #4d897d; }
    .stage-3 { --pet: #9c83c5; --pet-dark: #6d569c; }
    .stage-4 { --pet: #5b8fd1; --pet-dark: #3c65a5; }
    .stage-4 .body { width: 98px; height: 80px; left: 26px; }
    @keyframes bob { 50% { transform: translateY(-5px); } }
    .pet-name { margin: 0; font: 700 1.4rem Georgia, serif; }
    .stage-name { margin: 3px 0 16px; color: var(--accent-dark); font-weight: 600; }
    .progress-label { display: flex; justify-content: space-between; color: var(--muted); font-size: .85rem; }
    progress { width: 100%; height: 12px; accent-color: var(--green); }
    .tip { margin: 14px 0 0; color: var(--muted); font-size: .84rem; }
    .tasks-header { display: flex; justify-content: space-between; gap: 12px; align-items: center; margin-bottom: 16px; }
    h2 { margin: 0; font: 700 1.4rem Georgia, serif; }
    .day-picker { display: flex; gap: 6px; margin-bottom: 18px; }
    .day-picker button { min-width: 42px; padding: 7px 5px; border: 1px solid var(--border); border-radius: 10px; background: transparent; color: var(--muted); cursor: pointer; font: inherit; }
    .day-picker button span { display: block; font-size: .7rem; }
    .day-picker button strong { display: block; font-size: 1rem; }
    .day-picker button.selected { background: var(--accent); border-color: var(--accent); color: #fff; }
    .day-picker button.today:not(.selected) { border-color: var(--accent); color: var(--accent-dark); }
    .task-list { display: grid; gap: 9px; min-height: 90px; }
    .task { display: flex; align-items: center; gap: 10px; padding: 12px 13px; border: 1px solid var(--border); border-radius: 12px; background: #fffdf8; }
    .task input { width: 19px; height: 19px; accent-color: var(--green); }
    .task label { flex: 1; cursor: pointer; }
    .task.done label { color: var(--muted); text-decoration: line-through; }
    .remove { border: 0; background: transparent; color: var(--muted); cursor: pointer; font-size: 1.2rem; line-height: 1; }
    .remove:hover { color: var(--accent-dark); }
    .empty { color: var(--muted); text-align: center; padding: 22px 10px; }
    .add-task { display: flex; gap: 8px; margin-top: 16px; }
    input[type="text"] { min-width: 0; flex: 1; padding: 11px 13px; border: 1px solid var(--border); border-radius: 10px; background: #fffdf8; color: var(--text); font: inherit; }
    button.primary { padding: 10px 16px; border: 1px solid var(--accent); border-radius: 10px; background: var(--accent); color: #fff; cursor: pointer; font: 600 .95rem system-ui, sans-serif; }
    button.primary:hover { background: var(--accent-dark); border-color: var(--accent-dark); }
    button:focus-visible, input:focus-visible { outline: 3px solid #365f8d; outline-offset: 2px; }
    .week-summary { margin-top: 20px; }
    .summary-title { display: flex; justify-content: space-between; color: var(--muted); font-size: .85rem; }
    .dots { display: grid; grid-template-columns: repeat(7, 1fr); gap: 7px; margin-top: 8px; }
    .dot { height: 8px; border-radius: 99px; background: var(--border); }
    .dot.complete { background: var(--green); }
    .toast { min-height: 1.5em; margin: 13px 0 0; color: var(--green); font-size: .85rem; }
    @media (max-width: 700px) {
      header { display: block; } .week-label { margin-top: 10px; text-align: left; }
      .layout { grid-template-columns: 1fr; } .pet-stage { min-height: 190px; }
    }
    @media (prefers-reduced-motion: reduce) { .pet { animation: none; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Pixel Pet Planner</h1>
        <p>Complete small tasks. Feed your pet. Grow together.</p>
      </div>
      <div id="weekLabel" class="week-label"></div>
    </header>

    <div class="layout">
      <section class="card pet-card" aria-label="Your pixel pet">
        <div class="pet-stage">
          <div id="pet" class="pet stage-1" role="img" aria-label="Sprout, your pixel pet">
            <i class="pixel ear left"></i><i class="pixel ear right"></i><i class="pixel body"></i>
            <i class="pixel eye left"></i><i class="pixel eye right"></i><i class="pixel nose"></i>
            <i class="pixel foot left"></i><i class="pixel foot right"></i>
          </div>
        </div>
        <h2 id="petName" class="pet-name">Sprout</h2>
        <p id="stageName" class="stage-name">Tiny hatchling</p>
        <div class="progress-label"><span>Weekly growth</span><strong id="progressText">0 / 7 tasks</strong></div>
        <progress id="progress" max="7" value="0" aria-label="Weekly growth progress"></progress>
        <p id="petMessage" class="tip">A little care goes a long way.</p>
        <div class="week-summary">
          <div class="summary-title"><span>Days fed this week</span><span id="daysText">0 / 7</span></div>
          <div id="dots" class="dots" aria-label="Weekly completion"></div>
        </div>
      </section>

      <section class="card">
        <div class="tasks-header">
          <h2 id="dayTitle">Today's tasks</h2>
          <span id="dayCount" class="week-label"></span>
        </div>
        <nav id="dayPicker" class="day-picker" aria-label="Choose a day"></nav>
        <div id="taskList" class="task-list"></div>
        <form id="addForm" class="add-task">
          <input id="taskInput" type="text" maxlength="80" placeholder="Add a task..." aria-label="New task">
          <button class="primary" type="submit">Add task</button>
        </form>
        <p id="toast" class="toast" role="status"></p>
      </section>
    </div>
  </main>

  <script>
    const STORAGE_KEY = "pixel-pet-planner-v1";
    const dayNames = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
    const stages = [
      { name: "Tiny hatchling", threshold: 0, message: "A little care goes a long way." },
      { name: "Curious sprout", threshold: 2, message: "Your pet is peeking out of its shell!" },
      { name: "Happy companion", threshold: 4, message: "Look at those happy little hops." },
      { name: "Shining star", threshold: 7, message: "A whole week of care! Your pet is glowing." }
    ];
    const today = new Date();
    const dateKey = date => date.toISOString().slice(0, 10);
    const makeId = () => `task-${Date.now()}-${Math.random().toString(36).slice(2)}`;
    const weekStart = new Date(today);
    weekStart.setHours(0, 0, 0, 0);
    weekStart.setDate(today.getDate() - today.getDay());
    const weekId = dateKey(weekStart);
    let selectedDay = today.getDay();
    let state = loadState();

    function initialState() {
      const tasks = Array.from({ length: 7 }, () => []);
      tasks[selectedDay] = [
        { id: makeId(), text: "Drink a glass of water", done: false },
        { id: makeId(), text: "Choose one important thing", done: false },
        { id: makeId(), text: "Take a mindful break", done: false }
      ];
      return { weekId, tasks };
    }

    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (saved && saved.weekId === weekId && Array.isArray(saved.tasks)) return saved;
      } catch (error) {
        console.warn("Could not load saved planner state.", error);
      }
      return initialState();
    }

    function persist() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
      catch (error) { console.warn("Could not save planner state.", error); }
    }

    const dayPicker = document.getElementById("dayPicker");
    const taskList = document.getElementById("taskList");
    const taskInput = document.getElementById("taskInput");
    const toast = document.getElementById("toast");

    function allTasks() { return state.tasks.flat(); }
    function completedCount() { return allTasks().filter(task => task.done).length; }

    function renderDays() {
      dayPicker.replaceChildren();
      state.tasks.forEach((tasks, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = index === selectedDay ? "selected" : "";
        if (index === today.getDay()) button.classList.add("today");
        button.innerHTML = `<span>${dayNames[index]}</span><strong>${tasks.filter(task => task.done).length}</strong>`;
        button.setAttribute("aria-label", `${dayNames[index]}, ${tasks.length} tasks`);
        button.addEventListener("click", () => { selectedDay = index; render(); });
        dayPicker.append(button);
      });
    }

    function renderTasks() {
      const tasks = state.tasks[selectedDay];
      document.getElementById("dayTitle").textContent = selectedDay === today.getDay() ? "Today's tasks" : `${dayNames[selectedDay]}'s tasks`;
      document.getElementById("dayCount").textContent = `${tasks.filter(task => task.done).length} of ${tasks.length} complete`;
      taskList.replaceChildren();
      if (!tasks.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "No tasks yet. Add one small thing to get started.";
        taskList.append(empty);
        return;
      }
      tasks.forEach(task => {
        const row = document.createElement("div");
        row.className = `task${task.done ? " done" : ""}`;
        const checkbox = document.createElement("input");
        checkbox.type = "checkbox"; checkbox.checked = task.done; checkbox.id = task.id;
        checkbox.addEventListener("change", () => {
          task.done = checkbox.checked;
          persist(); render(); showToast(task.done ? "Task complete. Your pet enjoyed the snack!" : "Task reopened.");
        });
        const label = document.createElement("label");
        label.htmlFor = task.id; label.textContent = task.text;
        const remove = document.createElement("button");
        remove.className = "remove"; remove.type = "button"; remove.textContent = "×"; remove.setAttribute("aria-label", `Remove ${task.text}`);
        remove.addEventListener("click", () => {
          state.tasks[selectedDay] = state.tasks[selectedDay].filter(item => item.id !== task.id);
          persist(); render(); showToast("Task removed.");
        });
        row.append(checkbox, label, remove); taskList.append(row);
      });
    }

    function renderPet() {
      const count = completedCount();
      const stage = [...stages].reverse().find(item => count >= item.threshold);
      const stageIndex = stages.indexOf(stage) + 1;
      document.getElementById("pet").className = `pet stage-${stageIndex}`;
      document.getElementById("stageName").textContent = stage.name;
      document.getElementById("petMessage").textContent = stage.message;
      document.getElementById("progress").value = Math.min(count, 7);
      document.getElementById("progressText").textContent = `${count} / 7 tasks`;
      const fedDays = state.tasks.filter(tasks => tasks.length > 0 && tasks.every(task => task.done)).length;
      document.getElementById("daysText").textContent = `${fedDays} / 7`;
      const dots = document.getElementById("dots");
      dots.replaceChildren(...state.tasks.map(tasks => {
        const dot = document.createElement("span");
        dot.className = `dot${tasks.length && tasks.every(task => task.done) ? " complete" : ""}`;
        return dot;
      }));
      document.getElementById("pet").setAttribute("aria-label", `Sprout, ${stage.name}`);
    }

    function render() { renderDays(); renderTasks(); renderPet(); }
    function showToast(message) { toast.textContent = message; window.setTimeout(() => { toast.textContent = ""; }, 2800); }

    document.getElementById("addForm").addEventListener("submit", event => {
      event.preventDefault();
      const text = taskInput.value.trim();
      if (!text) { taskInput.focus(); return; }
      state.tasks[selectedDay].push({ id: makeId(), text, done: false });
      taskInput.value = ""; persist(); render(); showToast("New task added.");
    });

    const end = new Date(weekStart);
    end.setDate(end.getDate() + 6);
    document.getElementById("weekLabel").textContent = `Week of ${weekStart.toLocaleDateString(undefined, { month: "short", day: "numeric" })} – ${end.toLocaleDateString(undefined, { month: "short", day: "numeric" })}`;
    render();
  </script>
</body>
</html>
